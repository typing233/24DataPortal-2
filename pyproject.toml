[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataportal"
version = "1.0.0"
description = "Production-grade data portal for SQLite and CSV exploration"
requires-python = ">=3.10"
dependencies = [
    "starlette>=0.27.0",
    "uvicorn[standard]>=0.23.0",
    "jinja2>=3.1.0",
    "aiosqlite>=0.19.0",
    "click>=8.1.0",
    "python-multipart>=0.0.6",
    "chardet>=5.0.0",
    "watchfiles>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]

[project.scripts]
dataportal = "dataportal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
